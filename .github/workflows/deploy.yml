name: Genesys Cloud CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Validate and Apply
    runs-on: ubuntu-24.04 # FIXED: Force modern Node environment runtime execution

    env:
      GENESYSCLOUD_OAUTHCLIENT_ID: ${{ secrets.GENESYSCLOUD_CLIENT_ID }}
      GENESYSCLOUD_OAUTHCLIENT_SECRET: ${{ secrets.GENESYSCLOUD_CLIENT_SECRET }}
      GENESYSCLOUD_REGION: "ap-northeast-1"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7 # FIXED: Stable production baseline version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Pull Requests)
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply (Merge to Main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # FIXED: Feeds credentials explicitly via command line parameters to bypass runner proxy locks
        run: terraform apply -var="oauth_id=${{ secrets.GENESYSCLOUD_CLIENT_ID }}" -var="oauth_secret=${{ secrets.GENESYSCLOUD_CLIENT_SECRET }}" -auto-approve -no-color
